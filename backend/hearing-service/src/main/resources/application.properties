server.port=8083
spring.application.name=hearing-service

# MySQL Database Configuration (Pre-configured for DB linking)
spring.datasource.url=jdbc:mysql://localhost:3306/lexflow_hearing_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
