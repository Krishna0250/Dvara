version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: dvara-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dvara
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  case-service:
    build: ./backend/case-service
    container_name: dvara-case-service
    ports:
      - "8081:8081"
    depends_on:
      - mysqldb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/dvara?useSSL=false&allowPublicKeyRetrieval=true

  workflow-service:
    build: ./backend/workflow-service
    container_name: dvara-workflow-service
    ports:
      - "8082:8082"
    depends_on:
      - mysqldb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/dvara?useSSL=false&allowPublicKeyRetrieval=true

  hearing-service:
    build: ./backend/hearing-service
    container_name: dvara-hearing-service
    ports:
      - "8083:8083"
    depends_on:
      - mysqldb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/dvara?useSSL=false&allowPublicKeyRetrieval=true

  document-service:
    build: ./backend/document-service
    container_name: dvara-document-service
    ports:
      - "8084:8084"
    depends_on:
      - mysqldb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/dvara?useSSL=false&allowPublicKeyRetrieval=true

volumes:
  mysql_data:
